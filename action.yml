name: "Setup Ansible"
description: "A GitHub Action that installs Ansible and its dependencies."
inputs:
    version:
        required: true
        description: "The version of Ansible to install. Supports pip version specifiers (e.g., '==8.0.0', '>=8.0.0', '~=8.0', '>=8.0,<9.0')."
runs:
    using: "composite"
    steps:
        - name: "Install Python"
          uses: actions/setup-python@v4
          with:
              python-version: "3.12"

        - name: "Cache python packages"
          uses: actions/cache@v4
          with:
              path: ~/.cache/pip
              key: ${{ runner.os }}-${{ inputs.version }}

        - name: "Install packages"
          shell: bash
          run: |
              VERSION="${{ inputs.version }}"
              # If version doesn't start with an operator, prepend == for backward compatibility
              if [[ ! "$VERSION" =~ ^[=\<\>\!\~] ]]; then
                  VERSION="==$VERSION"
              fi
              python -m pip install "ansible$VERSION"
